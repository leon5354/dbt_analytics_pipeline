version: 2

models:
  - name: int_player_activity
    description: "Sessions aggregated to player level"
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: total_sessions
      - name: engagement_score
      - name: is_churned

  - name: int_player_revenue
    description: "Revenue aggregated to player level"
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: total_revenue
      - name: first_purchase
