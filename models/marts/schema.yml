version: 2

models:
  - name: mart_player_360
    description: "All player data in one table - use this for most analysis"
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: player_segment
        tests:
          - accepted_values:
              values: ['Whale', 'Dolphin', 'Active Free', 'Casual']
      - name: lifecycle_stage
      - name: is_payer
      - name: total_revenue

  - name: mart_daily_metrics
    description: "Daily KPIs for dashboards"
    columns:
      - name: date
        tests: [not_null]
      - name: arpu
      - name: payer_rate

  - name: mart_regional_performance
    description: "Metrics by region and country"
    columns:
      - name: region
        tests: [not_null]
      - name: country_code
        tests: [not_null]
