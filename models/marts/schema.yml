version: 2

models:
  - name: mart_player_360
    description: "All player data in one table - use this for most analysis"
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: player_segment
        description: "Revenue tier: Whale >= whale_threshold, Dolphin >= dolphin_threshold"
        tests:
          - accepted_values:
              arguments:
                values: ['Whale', 'Dolphin', 'Active Free', 'Casual']
      - name: lifecycle_stage
        tests:
          - accepted_values:
              arguments:
                values: ['Churned', 'Potential Converter', 'At Risk', 'Active Payer', 'New Player']
      - name: is_payer
      - name: total_revenue

  - name: mart_daily_metrics
    description: "Daily KPIs built from event-level sessions and transactions"
    columns:
      - name: date
        tests: [unique, not_null]
      - name: active_players
        description: "Distinct players with a session that day (DAU)"
      - name: arpdau
        description: "Revenue per daily active user; null on days with no sessions"

  - name: mart_regional_performance
    description: "Metrics by region and country"
    columns:
      - name: region
        tests: [not_null]
      - name: country_code
        tests: [not_null]
