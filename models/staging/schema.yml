version: 2

models:
  - name: stg_players
    description: "Cleaned player data"
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: signup_date
        tests: [not_null]
      - name: platform
        tests:
          - accepted_values:
              values: ['ios', 'android', 'switch']
      - name: region
        description: "NA, APAC, EMEA, or LATAM"

  - name: stg_transactions
    description: "Cleaned transaction data"
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: player_id
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_sessions
    description: "Cleaned session data"
    columns:
      - name: session_id
        tests: [unique, not_null]
      - name: player_id
        tests: [not_null]
