name: 'game_analytics'
version: '1.0.0'
config-version: 2

profile: 'game_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Snapshot date for recency / churn logic. Fixed (not current_date) so the
  # same data always gives the same answer. Override: --vars '{as_of_date: ...}'
  as_of_date: '2025-03-31'

  # Business thresholds (revenue in USD)
  whale_threshold: 50
  dolphin_threshold: 10
  churn_days: 30

on-run-start:
  - "{{ log('Starting dbt run for Game Analytics Pipeline', info=true) }}"

on-run-end:
  - "{{ log('dbt run completed successfully', info=true) }}"
